<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Student ID Card Preview - Modern</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body {
            background: #f7f7fa;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 14px;
        }
        .form-section {
            background: #fff;
            padding: 17px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(64,64,64,0.07);
            margin-bottom: 22px;
            max-width: 400px;
            margin: 0 auto 22px auto;
        }
        .form-section h2 {
            text-align: center;
            margin-bottom: 18px;
        }
        .form-section label {
            display: block;
            color: #263692;
            font-weight: 500;
            margin-top: 12px;
            margin-bottom: 3px;
            font-size: 14px;
        }
        .form-section input, .form-section textarea, .form-section select {
            width: 100%;
            border: 1px solid #bbb;
            border-radius: 5px;
            padding: 7px;
            margin-bottom: 11px;
            font-size: 16px;
        }
        button {
            background-color: #262c6b;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        button:hover {
            background-color: #1e234f;
        }
        /* ID Card Styling */
        .id-card {
            background: #fff;
            border-radius: 22px;
            box-shadow: 0 4px 16px 2px rgba(100,100,110,0.07);
            max-width: 540px;
            margin: 20px auto 10px auto;
            padding: 32px 32px 25px 32px;
            position: relative;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: none; /* Initially hidden */
        }
        .id-title-row {
            display: flex;
            justify-content: space-between;
            align-items: start;
        }
        .school-name {
            font-size: 2rem;
            font-weight: 700;
            color: #262c6b;
            margin-bottom: 4px;
            letter-spacing: 2px;
        }
        .id-gold-label {
            background: linear-gradient(90deg,#fff7d6,#e9d782 60%,#b69237 100%);
            color: #343434;
            padding: 7px 28px;
            border-radius: 0 17px 17px 0;
            font-size: 1rem;
            font-weight: 500;
            box-shadow: 0 2px 7px rgba(60,60,60,0.06);
            margin-left: 18px;
            margin-top: 5px;
        }
        .id-divider {
            border-top: 3px solid #292e76;
            border-radius: 5px;
            margin: 20px 0 15px 0;
        }
        .id-row {
            display: flex;
            gap: 32px;
            align-items: flex-start;
        }
        .id-photo {
            width: 160px;
            height: 160px;
            border-radius: 15px;
            object-fit: cover;
            background: #e1e7f3;
            box-shadow: 0 1px 9px rgba(45,45,45,0.03);
            margin-left: 7px;
        }
        .id-fields {
            flex: 2;
            display: flex;
            flex-direction: column;
            margin-top: 7px;
        }
        .id-field-label {
            color: #292e76;
            font-weight: 600;
            font-size: 1.08em;
            margin-top: 13px;
            margin-bottom: 3px;
        }
        .id-field-value {
            color: #222;
            font-size: 1.27em;
            font-weight: 400;
            margin-bottom: 2px;
            margin-left: 2px;
        }
        #submitBtn {
            display: none;
            max-width: 540px;
            margin: 0 auto 30px auto;
        }
        /* Description under photo input */
        .photo-desc {
            font-size: 0.9em;
            color: #555;
            margin-top: -8px;
            margin-bottom: 10px;
        }
        @media (max-width: 700px) {
            .id-card { padding: 17px 4vw 19px 4vw; }
            .id-row { flex-direction: column; gap: 14px; }
            .id-photo { margin: 0 auto 8px auto; }
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="form-section">
        <h2>Enter Student Details</h2>

        <label>Student Name</label>
        <input type="text" id="studentName" placeholder="Name" />

        <label>Section</label>
        <select id="section">
            <option value="">Select Section</option>
            <option value="Section 1">Section 1</option>
            <option value="Section 2">Section 2</option>
            <option value="Section 3">Section 3</option>
            <option value="Section 4">Section 4</option>
        </select>

        <label>School Name</label>
        <select id="schoolName">
            <option value="">Select School</option>
            <option value="School 1">School 1</option>
            <option value="School 2">School 2</option>
            <option value="School 3">School 3</option>
            <option value="School 4">School 4</option>
            <option value="School 5">School 5</option>
            <option value="School 6">School 6</option>
            <option value="School 7">School 7</option>
            <option value="School 8">School 8</option>
            <option value="School 9">School 9</option>
            <option value="School 10">School 10</option>
            <option value="School 11">School 11</option>
            <option value="School 12">School 12</option>
            <option value="School 13">School 13</option>
            <option value="School 14">School 14</option>
            <option value="School 15">School 15</option>
        </select>

        <label>Phone</label>
        <input type="text" id="phone" placeholder="10-digit phone number" maxlength="10" pattern="\d{10}" title="Enter exactly 10 digits" />

        <label>Address</label>
        <textarea id="address" rows="2" placeholder="Address"></textarea>

        <label>Photo</label>
        <input type="file" id="photo" onchange="previewPhoto(event)" />
        <div class="photo-desc">Upload any image file (no restrictions on format or dimensions).</div>

        <button type="button" onclick="previewCard()">Preview</button>
    </div>

    <div class="id-card" id="idCard">
        <div class="id-title-row">
            <div class="school-name" id="cardSchoolName">SCHOOL NAME</div>
            <div class="id-gold-label">Student ID Card</div>
        </div>
        <div class="id-divider"></div>
        <div class="id-row">
            <img src="image.jpg" id="cardPhoto" class="id-photo" alt="Student Photo" />
            <div class="id-fields">
                <div class="id-field-label">Nama</div>
                <div class="id-field-value" id="cardStudentName"></div>
                <div class="id-field-label">Section</div>
                <div class="id-field-value" id="cardSection"></div>
                <div class="id-field-label">Phone</div>
                <div class="id-field-value" id="cardPhone"></div>
                <div class="id-field-label">Address</div>
                <div class="id-field-value" id="cardAddress"></div>
            </div>
        </div>
    </div>

    <button type="button" id="submitBtn">Submit</button>

<script>
    function previewCard() {
        const schoolName = document.getElementById('schoolName').value;
        const studentName = document.getElementById('studentName').value;
        const section = document.getElementById('section').value;
        const phone = document.getElementById('phone').value;
        const address = document.getElementById('address').value;
        const photoInput = document.getElementById('photo');
        const file = photoInput.files[0];

        // Validate phone (10 digits)
        const phoneRegex = /^\d{10}$/;
        if (!phoneRegex.test(phone)) {
            alert('Phone number must be exactly 10 digits.');
            return;
        }

        // Validate photo presence
        if (!file) {
            alert('Please upload a photo.');
            return;
        }

        // No restriction on file format or dimensions anymore
        // Just preview the image
        const img = new Image();
        img.onload = function () {
            updatePreviewCard(schoolName, studentName, section, phone, address);
        };
        img.onerror = function () {
            alert('Error loading image file.');
            return;
        };
        img.src = URL.createObjectURL(file);
    }

    function updatePreviewCard(schoolName, studentName, section, phone, address) {
        document.getElementById('cardSchoolName').textContent = schoolName || 'SCHOOL NAME';
        document.getElementById('cardStudentName').textContent = studentName || 'Student Name';
        document.getElementById('cardSection').textContent = section || 'Section';
        document.getElementById('cardPhone').textContent = phone || 'Phone';
        document.getElementById('cardAddress').textContent = address || 'Address';

        document.getElementById('idCard').style.display = 'block';
        document.getElementById('submitBtn').style.display = 'block';
    }

    function previewPhoto(event) {
        const file = event.target.files[0];
        const img = document.getElementById('cardPhoto');
        if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        } else {
            img.src = 'image.jpg';
        }
    }

    // Submission logic to send data to Google Sheets via Google Apps Script
    const submitBtn = document.getElementById('submitBtn');

    async function uploadFile(file) {
        return new Promise((resolve, reject) => {
            const fr = new FileReader();
            fr.onload = (e) => {
                const data = e.target.result.split(',');
                const obj = {
                    fileName: file.name,
                    mimeType: data[0].match(/:(\w.+);/)[1],
                    data: data[1],
                };
                resolve(obj);
            };
            fr.onerror = reject;
            fr.readAsDataURL(file);
        });
    }

    submitBtn.addEventListener('click', async () => {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Submitting...';

        const schoolName = document.getElementById('schoolName').value;
        const studentName = document.getElementById('studentName').value;
        const section = document.getElementById('section').value;
        const phone = document.getElementById('phone').value;
        const address = document.getElementById('address').value;
        const photoInput = document.getElementById('photo');

        // Basic validation
        if (!studentName || !schoolName || !section || !phone || !address) {
            alert('Please fill all the fields.');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit';
            return;
        }

        // Phone validation
        const phoneRegex = /^\d{10}$/;
        if (!phoneRegex.test(phone)) {
            alert('Phone number must be exactly 10 digits.');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit';
            return;
        }

        let fileObj = null;
        if (photoInput.files.length > 0) {
            try {
                fileObj = await uploadFile(photoInput.files[0]);
            } catch (e) {
                alert('Error reading photo file.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit';
                return;
            }
        } else {
            alert('Please upload a photo.');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit';
            return;
        }

        // Prepare payload data for submission
        const formDataObj = {
            studentName,
            schoolName,
            section,
            phone,
            address,
            photoData: fileObj,
        };

        try {
            const scriptURL =
                'https://script.google.com/macros/s/AKfycbyyBALgOKSFffzLiEFLb3X6_jwa5WjKx0F212PpQOOJEwAgJQ93rVB9E4ehJGkTIMS2/exec';
            const response = await fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify(formDataObj),
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8',
                },
            });

            const data = await response.json();

            if (data.status === 'success') {
                alert(data.message || 'Data submitted successfully!');
                // Reset form and hide preview + submit button
                document.getElementById('studentName').value = '';
                document.getElementById('schoolName').value = '';
                document.getElementById('section').value = '';
                document.getElementById('phone').value = '';
                document.getElementById('address').value = '';
                document.getElementById('photo').value = '';
                document.getElementById('idCard').style.display = 'none';
                submitBtn.style.display = 'none';
            } else {
                alert(data.message || 'Submission failed');
            }
        } catch (error) {
            alert('Submission error: ' + error.message);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit';
        }
    });
</script>
</body>
</html>
